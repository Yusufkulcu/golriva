<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hata Kayıtları · GolRiva</title>
<link rel="stylesheet" href="ortak.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(typeof supabase==='undefined'){document.write('<scr'+'ipt src="https://unpkg.com/@supabase/supabase-js@2"></scr'+'ipt>')}</script>
<script src="ortak.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await sayfaKur({sayfa:'hata', baslik:'Hata Kayıtları',
      alt:'Kullanıcı bunları hiç görmez — sade mesaj gösterilir, teknik detay buraya düşer'})) return;
  document.getElementById('ust-sag').innerHTML = tazeleGostergeHtml();
  var G = document.getElementById('govde');
  var sayfaFiltre = '';
  var seviye = 'kritik';   // aktif sekme: kritik | hata | uyari | bilgi | hepsi

  var SEV = {
    kritik:['Kritik','kotu','çökme / kod hatası — önce bunlar'],
    hata:  ['Hata','uyari','işlev başarısız'],
    uyari: ['Uyarı','notr','kullanıcı / cihaz kaynaklı (saat, boş alan, şifre)'],
    bilgi: ['Bilgi','iyi','bilinen gürültü (ağ, kapanmış maç, reklam stoku)'],
  };

  async function sayim(sev, bugunISO){
    var q = sb.from('hata_kayitlari').select('id',{count:'exact',head:true});
    if(sev) q = q.eq('seviye', sev);
    if(bugunISO) q = q.gte('created_at', bugunISO);
    return hataAt(await q).count || 0;
  }

  async function yukle(){
    var bugunISO = new Date(new Date().setHours(0,0,0,0)).toISOString();
    var kayitlar, say = {}, bugun = {}, faz31 = true;
    try{
      var q = sb.from('hata_kayitlari').select('*').order('created_at',{ascending:false}).limit(150);
      if(seviye !== 'hepsi') q = q.eq('seviye', seviye);
      if(sayfaFiltre) q = q.ilike('sayfa', '%'+sayfaFiltre+'%');
      kayitlar = hataAt(await q).data || [];
      for(var k in SEV){ say[k] = await sayim(k); bugun[k] = await sayim(k, bugunISO); }
    }catch(e){
      // seviye kolonu yoksa (faz2_31 çalışmamış) eski görünüme düş
      if(String(e.message||e).indexOf('seviye')>=0){
        faz31 = false;
        try{
          kayitlar = hataAt(await sb.from('hata_kayitlari').select('*')
                       .order('created_at',{ascending:false}).limit(150)).data || [];
        }catch(e2){ G.innerHTML = sunucuEksik('supabase/faz2_8_hata.sql', e2); Tazele.durdur(); return; }
      } else { G.innerHTML = sunucuEksik('supabase/faz2_8_hata.sql', e); Tazele.durdur(); return; }
    }

    await adlariYukle(kayitlar.filter(function(x){return x.user_id;}).map(function(x){return x.user_id;}));

    // aynı sorunu grupla (bu sekmede)
    var sayac = {}, ilkSatir = {};
    kayitlar.forEach(function(x){
      var a = x.sayfa+'§'+String(x.mesaj).split('\n')[0];
      sayac[a] = (sayac[a]||0)+1; ilkSatir[a] = x;
    });
    var gruplar = Object.keys(sayac).map(function(a){ return {a:a, n:sayac[a], x:ilkSatir[a]}; })
                    .sort(function(p,q){ return q.n-p.n; }).slice(0,6);

    var sekmeler = faz31 ? Object.keys(SEV).map(function(k){
      var s=SEV[k];
      return '<div class="olcut" style="cursor:pointer;'+(seviye===k?'outline:2px solid var(--vurgu);':'')+'" onclick="sekme(\''+k+'\')">'+
        '<div class="etiket"><span class="rz '+s[1]+'">'+s[0]+'</span></div>'+
        '<div class="deger">'+S(say[k])+'</div>'+
        '<div class="not">bugün '+S(bugun[k])+' · '+E(s[2])+'</div></div>';
    }).join('') : '';

    G.innerHTML =
      (faz31 ? '<div class="izgara k4" style="margin-bottom:14px">'+sekmeler+'</div>'
             : '<div class="kart" style="margin-bottom:14px"><div class="kart-govde">Seviye ayrımı için '+
               '<code>supabase/faz2_31_hata_seviye.sql</code> çalıştırılmalı — şimdilik tüm kayıtlar tek listede.</div></div>')+

      (gruplar.length ?
      '<div class="kart" style="margin-bottom:14px"><div class="kart-bas"><h2>En sık tekrarlayanlar'+
        (faz31 && seviye!=='hepsi' ? ' — '+E(SEV[seviye][0]) : '')+'</h2>'+
        '<span class="ipucu">önce bunları çöz</span></div><div class="kart-govde">'+
        gruplar.map(function(g){
          return '<div class="ozet-satir"><span><b>'+E(g.x.sayfa)+'</b><br>'+
                 '<span class="mono">'+E(String(g.x.mesaj).split('\n')[0].slice(0,90))+'</span></span>'+
                 '<span><span class="rz '+(g.n>2?'kotu':'uyari')+'">×'+g.n+'</span></span></div>';
        }).join('')+'</div></div>' : '')+

      '<div class="kart"><div class="kart-bas"><h2>Kayıtlar'+
        (faz31 ? ' · <span class="rz '+(seviye==='hepsi'?'notr':SEV[seviye][1])+'">'+(seviye==='hepsi'?'Hepsi':SEV[seviye][0])+'</span>' : '')+'</h2>'+
        '<div class="sag" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
          (faz31 ? '<button class="kucuk '+(seviye==='hepsi'?'ana':'')+'" onclick="sekme(\'hepsi\')">Hepsi</button>' : '')+
          '<div class="ara-kutu" style="max-width:220px">'+IK.ara+
            '<input id="ara" placeholder="sayfa/konum filtrele…" value="'+E(sayfaFiltre)+'"></div>'+
          '<button class="kucuk ana" onclick="raporKopyala()">Claude\'a rapor</button>'+
          (faz31 && seviye!=='hepsi' ? '<button class="kucuk" onclick="seviyeSil()">Bu seviyeyi sil</button>' : '')+
          '<button class="kucuk" onclick="temizle()">7 gün öncesini sil</button>'+
          '<button class="kucuk tehlike" onclick="tumunuSil()">Tüm hataları sil</button>'+
        '</div></div>'+
        '<div class="kart-govde sifir"><div class="tablo-sar"><table class="duyarli"><thead><tr>'+
        '<th>Tarih</th>'+(faz31?'<th>Seviye</th>':'')+'<th>Kullanıcı</th><th>Konum</th><th>Teknik mesaj</th><th>Sürüm</th><th>Platform</th>'+
        '</tr></thead><tbody>'+
        (kayitlar.length ? kayitlar.map(function(x){
          var sv = SEV[x.seviye] || ['?','notr',''];
          return '<tr><td data-bas="Tarih" class="mono">'+T(x.created_at)+'</td>'+
            (faz31 ? '<td data-bas="Seviye"><span class="rz '+sv[1]+'">'+sv[0]+'</span></td>' : '')+
            '<td data-bas="Kullanıcı">'+(x.user_id ? kisiHtml(x.user_id) : '<span class="mono">oturumsuz</span>')+'</td>'+
            '<td data-bas="Konum"><b class="mono" style="color:var(--metin)">'+E(x.sayfa)+'</b></td>'+
            '<td data-bas="Mesaj" style="max-width:380px"><div class="mono" style="white-space:pre-wrap;word-break:break-word">'+
              E(x.mesaj)+'</div></td>'+
            '<td data-bas="Sürüm" class="mono">'+E(x.surum||'—')+'</td>'+
            '<td data-bas="Platform"><span class="rz notr">'+E(x.platform||'—')+'</span></td></tr>';
        }).join('') : '<tr><td colspan="7">'+bosDurum('Bu sekmede kayıt yok — tertemiz')+'</td></tr>')+
        '</tbody></table></div></div></div>';

    var zaman=null;
    document.getElementById('ara').addEventListener('input', function(){
      var v = this.value; clearTimeout(zaman);
      zaman = setTimeout(function(){ sayfaFiltre = v.trim(); yukle(); }, 300);
    });
  }

  window.sekme = function(k){ seviye = k; yukle(); };

  // ── CLAUDE'A RAPOR: aktif sekmedeki (ya da tum) kayitlari, sohbete
  // yapistirilacak ozetlenmis METIN olarak panoya kopyalar. Ayni sorun
  // gruplanir (xN), surum/platform dagilimi ve en yeni ornegin tam
  // mesaji eklenir — teshis icin gereken her sey tek blokta.
  window.raporKopyala = async function(){
    var kayitlar;
    try{
      var q = sb.from('hata_kayitlari').select('*')
                .order('created_at',{ascending:false}).limit(500);
      if(seviye !== 'hepsi') q = q.eq('seviye', seviye);
      if(sayfaFiltre) q = q.ilike('sayfa', '%'+sayfaFiltre+'%');
      kayitlar = hataAt(await q).data || [];
    }catch(e){ toast('Rapor alınamadı: '+(e.message||e), true); return; }
    if(!kayitlar.length){ toast('Bu sekmede kayıt yok — rapor boş', true); return; }

    function grupla(liste){
      var g = {};
      liste.forEach(function(x){
        var a = x.sayfa+'§'+String(x.mesaj).split('\n')[0].slice(0,120);
        if(!g[a]) g[a] = {n:0, x:x, surum:{}, platform:{}, ilk:x.created_at, son:x.created_at};
        g[a].n++;
        g[a].surum[x.surum||'?']=1; g[a].platform[x.platform||'?']=1;
        if(x.created_at < g[a].ilk) g[a].ilk = x.created_at;
        if(x.created_at > g[a].son){ g[a].son = x.created_at; g[a].x = x; }
      });
      return Object.keys(g).map(function(a){ return g[a]; })
               .sort(function(p,q){ return q.n-p.n; });
    }
    function bolum(ad, liste){
      if(!liste.length) return '';
      var m = '\n## '+ad+' ('+liste.length+' kayıt, '+grupla(liste).length+' farklı sorun)\n';
      grupla(liste).forEach(function(g, i){
        m += '\n### '+(i+1)+') '+g.x.sayfa+'  ×'+g.n+'\n'+
          '- sürüm: '+Object.keys(g.surum).join(', ')+' · platform: '+Object.keys(g.platform).join(', ')+'\n'+
          '- ilk: '+g.ilk.slice(0,16).replace('T',' ')+' · son: '+g.son.slice(0,16).replace('T',' ')+
          (g.x.user_id ? ' · kullanıcı: '+(adlar[g.x.user_id]&&adlar[g.x.user_id].ad||g.x.user_id.slice(0,8)) : ' · oturumsuz')+'\n'+
          '```\n'+String(g.x.mesaj).slice(0,700)+'\n```\n';
      });
      return m;
    }

    var simdi = new Date().toLocaleString('tr-TR');
    var rapor = '# GolRiva hata raporu — '+simdi+
      (sayfaFiltre ? ' · filtre: '+sayfaFiltre : '')+'\n';
    if(seviye === 'hepsi'){
      ['kritik','hata','uyari','bilgi'].forEach(function(k){
        rapor += bolum((SEV[k]||[k])[0].toUpperCase(),
                       kayitlar.filter(function(x){return x.seviye===k;}));
      });
      // seviye kolonu yoksa (faz2_31 oncesi) hepsi tek bolum
      if(rapor.length < 80) rapor += bolum('KAYITLAR', kayitlar);
    } else {
      rapor += bolum((SEV[seviye]||[seviye])[0].toUpperCase(), kayitlar);
    }
    rapor += '\n(son 500 kayıt üzerinden; admin panel → Hata Kayıtları)\n';

    try{
      await navigator.clipboard.writeText(rapor);
      toast('Rapor panoya kopyalandı — Claude sohbetine yapıştır');
    }catch(e){
      // pano izni yoksa dosya olarak indir
      var b = new Blob([rapor], {type:'text/plain;charset=utf-8'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'golriva_hata_raporu.txt';
      a.click(); URL.revokeObjectURL(a.href);
      toast('Pano kullanılamadı — rapor dosya olarak indirildi');
    }
  };

  window.temizle = async function(){
    if(!confirm('7 günden eski hata kayıtları silinsin mi?')) return;
    var sinir = new Date(Date.now()-7*24*3600*1000).toISOString();
    if(await dene(async function(){
      hataAt(await sb.from('hata_kayitlari').delete().lt('created_at', sinir));
    }, 'Eski kayıtlar silindi')) yukle();
  };
  window.seviyeSil = async function(){
    var ad = (SEV[seviye]||['?'])[0];
    if(!confirm('"'+ad+'" seviyesindeki TÜM kayıtlar silinsin mi?')) return;
    if(await dene(async function(){
      hataAt(await sb.from('hata_kayitlari').delete().eq('seviye', seviye));
    }, ad+' kayıtları silindi')) yukle();
  };
  window.tumunuSil = async function(){
    if(!confirm('TÜM hata kayıtları kalıcı olarak silinecek. Emin misin?')) return;
    if(prompt('Onaylamak için SIL yaz:') !== 'SIL'){ toast('Onay eşleşmedi, iptal', true); return; }
    if(await dene(async function(){
      hataAt(await sb.from('hata_kayitlari').delete().gte('id', 0));
    }, 'Tüm hata kayıtları silindi')) yukle();
  };

  Tazele.baslat(yukle, 30000);
})();
</script>
</body>
</html>
