<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referans Kodları · GolRiva</title>
<link rel="stylesheet" href="ortak.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(typeof supabase==='undefined'){document.write('<scr'+'ipt src="https://unpkg.com/@supabase/supabase-js@2"></scr'+'ipt>')}</script>
<script src="ortak.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await sayfaKur({sayfa:'referans', baslik:'Referans Kodları',
    alt:'Reklam kampanyası takibi — kod başına gelen kullanıcı ve dağıtılan Riva'})) return;
  var G = document.getElementById('govde');

  async function yukle(){
    var kodlar, kullanimlar=[];
    try{ kodlar = hataAt(await sb.from('referans_kodlari').select('*')
           .order('created_at',{ascending:false})).data || []; }
    catch(e){ G.innerHTML = sunucuEksik('supabase/faz2_13_referans.sql', e); return; }
    try{ kullanimlar = hataAt(await sb.from('referans_kullanimlari')
           .select('kod, user_id, miktar, created_at')
           .order('created_at',{ascending:false}).limit(10000)).data || []; }catch(e){}

    // kod bazında toplama
    var ozet = {};
    kullanimlar.forEach(function(u){
      var o = ozet[u.kod] || (ozet[u.kod] = {adet:0, riva:0, hafta:0});
      o.adet++; o.riva += (u.miktar||0);
      if(Date.now() - new Date(u.created_at).getTime() < 7*86400000) o.hafta++;
    });
    var toplamKullanim = kullanimlar.length;
    var toplamRiva = kullanimlar.reduce(function(t,u){ return t + (u.miktar||0); }, 0);
    var haftaKullanim = kullanimlar.filter(function(u){
      return Date.now() - new Date(u.created_at).getTime() < 7*86400000; }).length;

    var son = kullanimlar.slice(0, 50);
    await adlariYukle(son.map(function(u){ return u.user_id; }));

    G.innerHTML =
      '<div class="izgara k4" style="margin-bottom:14px">'+
        '<div class="olcut"><div class="etiket">Aktif kod</div><div class="deger">'+
          kodlar.filter(function(k){return k.aktif;}).length+'</div><div class="not">toplam '+kodlar.length+'</div></div>'+
        '<div class="olcut"><div class="etiket">Gelen kullanıcı</div><div class="deger">'+S(toplamKullanim)+'</div></div>'+
        '<div class="olcut"><div class="etiket">Son 7 gün</div><div class="deger">'+S(haftaKullanim)+'</div></div>'+
        '<div class="olcut"><div class="etiket">Dağıtılan Riva</div><div class="deger">'+S(toplamRiva)+'</div></div>'+
      '</div>'+

      '<div class="kart" style="margin-bottom:14px">'+
        '<div class="kart-bas"><h2>Kodlar</h2>'+
          '<span class="ipucu">kod: 3-20 karakter, BÜYÜK harf / rakam / alt çizgi · Riva 0 = yalnız takip</span></div>'+
        '<div class="kart-govde sifir"><div class="tablo-sar"><table class="duyarli"><thead><tr>'+
        '<th>Kod</th><th>Açıklama (kanal)</th><th>Riva</th><th>Gelen</th><th>7 gün</th><th>Dağıtılan</th><th>Durum</th><th></th>'+
        '</tr></thead><tbody>'+
        (kodlar.length ? kodlar.map(function(k){
          var o = ozet[k.kod] || {adet:0, riva:0, hafta:0};
          return '<tr>'+
            '<td data-bas="Kod" class="mono"><b>'+E(k.kod)+'</b></td>'+
            '<td data-bas="Açıklama"><input id="r-not-'+E(k.kod)+'" value="'+E(k.aciklama||'')+'" placeholder="kanal notu" style="min-width:130px"></td>'+
            '<td data-bas="Riva"><input id="r-riva-'+E(k.kod)+'" type="number" min="0" value="'+k.riva+'" style="width:90px"></td>'+
            '<td data-bas="Gelen" class="sayi">'+S(o.adet)+'</td>'+
            '<td data-bas="7 gün" class="sayi">'+S(o.hafta)+'</td>'+
            '<td data-bas="Dağıtılan" class="sayi">'+S(o.riva)+'</td>'+
            '<td data-bas="Durum">'+(k.aktif?'<span class="rz iyi">aktif</span>':'<span class="rz notr">pasif</span>')+'</td>'+
            '<td class="sag" style="white-space:nowrap">'+
              '<button class="kucuk ana" onclick="kaydet(\''+E(k.kod)+'\')">Kaydet</button> '+
              '<button class="kucuk '+(k.aktif?'tehlike':'')+'" onclick="acKapa(\''+E(k.kod)+'\','+(!k.aktif)+')">'+
                (k.aktif?'Pasifleştir':'Aktifleştir')+'</button>'+
            '</td></tr>';
        }).join('') : '')+
        '<tr style="background:var(--yuzey-2)">'+
          '<td data-bas="Kod"><input id="y-kod" placeholder="KICK50" style="min-width:110px;text-transform:uppercase"></td>'+
          '<td data-bas="Açıklama"><input id="y-not" placeholder="Kick yayını Ağustos" style="min-width:130px"></td>'+
          '<td data-bas="Riva"><input id="y-riva" type="number" min="0" placeholder="250" style="width:90px"></td>'+
          '<td colspan="3" class="mono">yeni kod</td>'+
          '<td class="mono">aktif başlar</td>'+
          '<td class="sag"><button class="kucuk ana" onclick="ekle()">Ekle</button></td>'+
        '</tr></tbody></table></div></div></div>'+

      '<div class="kart"><div class="kart-bas"><h2>Son kullanımlar</h2><span class="ipucu">son 50 kayıt</span></div>'+
        '<div class="kart-govde sifir"><div class="tablo-sar"><table class="duyarli"><thead><tr>'+
        '<th>Kullanıcı</th><th>Kod</th><th>Riva</th><th>Tarih</th>'+
        '</tr></thead><tbody>'+
        (son.length ? son.map(function(u){
          return '<tr><td data-bas="Kullanıcı">'+kisiHtml(u.user_id)+'</td>'+
            '<td data-bas="Kod" class="mono">'+E(u.kod)+'</td>'+
            '<td data-bas="Riva" class="sayi'+(u.miktar>0?' arti':'')+'">'+(u.miktar>0?'+':'')+S(u.miktar)+'</td>'+
            '<td data-bas="Tarih" class="mono">'+T(u.created_at)+'</td></tr>';
        }).join('') : '<tr><td colspan="4">'+bosDurum('Henüz referanslı kayıt yok')+'</td></tr>')+
        '</tbody></table></div></div></div>';
  }

  window.kaydet = async function(kod){
    var riva = parseInt(document.getElementById('r-riva-'+kod).value, 10);
    if(isNaN(riva) || riva < 0 || riva > 100000){
      toast('Riva 0-100.000 arasında olmalı', true); return; }
    if(await dene(async function(){
      hataAt(await sb.from('referans_kodlari').update({
        aciklama: document.getElementById('r-not-'+kod).value.trim() || null,
        riva: riva
      }).eq('kod', kod));
    }, kod+' güncellendi — yeni kullanımlar bu Riva ile işler')) yukle();
  };
  window.acKapa = async function(kod, aktif){
    if(await dene(async function(){
      hataAt(await sb.from('referans_kodlari').update({aktif:aktif}).eq('kod',kod));
    }, kod + (aktif?' aktifleştirildi':' pasifleştirildi — yeni kayıtlar bu kodu kullanamaz'))) yukle();
  };
  window.ekle = async function(){
    var kod  = document.getElementById('y-kod').value.trim().toUpperCase();
    var riva = parseInt(document.getElementById('y-riva').value, 10);
    if(!/^[A-Z0-9_]{3,20}$/.test(kod)){
      toast('Kod 3-20 karakter: BÜYÜK harf, rakam, alt çizgi', true); return; }
    if(isNaN(riva) || riva < 0 || riva > 100000){
      toast('Riva 0-100.000 arasında olmalı (0 = yalnız takip)', true); return; }
    if(await dene(async function(){
      hataAt(await sb.from('referans_kodlari').insert({kod:kod, riva:riva,
        aciklama: document.getElementById('y-not').value.trim() || null}));
    }, kod+' oluşturuldu — reklamda bu kodu paylaş')) yukle();
  };

  yukle();
})();
</script>
</body>
</html>
