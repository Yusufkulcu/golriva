<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hata Kayıtları · GolRiva</title>
<link rel="stylesheet" href="ortak.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(typeof supabase==='undefined'){document.write('<scr'+'ipt src="https://unpkg.com/@supabase/supabase-js@2"></scr'+'ipt>')}</script>
<script src="ortak.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await sayfaKur({sayfa:'hata', baslik:'Hata Kayıtları',
      alt:'Kullanıcı bunları hiç görmez — sade mesaj gösterilir, teknik detay buraya düşer'})) return;
  document.getElementById('ust-sag').innerHTML = tazeleGostergeHtml();
  var G = document.getElementById('govde');
  var sayfaFiltre = '';

  async function yukle(){
    var bugunISO = new Date(new Date().setHours(0,0,0,0)).toISOString();
    var kayitlar, bugun = 0;
    try{
      var q = sb.from('hata_kayitlari').select('*').order('created_at',{ascending:false}).limit(150);
      if(sayfaFiltre) q = q.ilike('sayfa', '%'+sayfaFiltre+'%');
      kayitlar = hataAt(await q).data || [];
      bugun = hataAt(await sb.from('hata_kayitlari').select('id',{count:'exact',head:true})
                .gte('created_at', bugunISO)).count || 0;
    }catch(e){ G.innerHTML = sunucuEksik('supabase/faz2_8_hata.sql', e); Tazele.durdur(); return; }

    await adlariYukle(kayitlar.filter(function(x){return x.user_id;}).map(function(x){return x.user_id;}));

    // aynı sorunu grupla
    var sayac = {}, ilkSatir = {};
    kayitlar.forEach(function(x){
      var a = x.sayfa+'§'+String(x.mesaj).split('\n')[0];
      sayac[a] = (sayac[a]||0)+1; ilkSatir[a] = x;
    });
    var gruplar = Object.keys(sayac).map(function(a){ return {a:a, n:sayac[a], x:ilkSatir[a]}; })
                    .sort(function(p,q){ return q.n-p.n; }).slice(0,6);

    G.innerHTML =
      '<div class="izgara k4" style="margin-bottom:14px">'+
        '<div class="olcut"><div class="etiket">Bugün</div><div class="deger">'+S(bugun)+'</div>'+
          '<div class="not '+(bugun>0?'dusus':'artis')+'">'+(bugun>0?'incelenmeli':'temiz')+'</div></div>'+
        '<div class="olcut"><div class="etiket">Son kayıtlar</div><div class="deger">'+kayitlar.length+'</div></div>'+
        '<div class="olcut"><div class="etiket">Farklı sorun</div><div class="deger">'+Object.keys(sayac).length+'</div></div>'+
        '<div class="olcut"><div class="etiket">Etkilenen kullanıcı</div><div class="deger">'+
          Object.keys(kayitlar.reduce(function(t,x){ if(x.user_id) t[x.user_id]=1; return t; },{})).length+'</div></div>'+
      '</div>'+

      (gruplar.length ?
      '<div class="kart" style="margin-bottom:14px"><div class="kart-bas"><h2>En sık tekrarlayanlar</h2>'+
        '<span class="ipucu">önce bunları çöz</span></div><div class="kart-govde">'+
        gruplar.map(function(g){
          return '<div class="ozet-satir"><span><b>'+E(g.x.sayfa)+'</b><br>'+
                 '<span class="mono">'+E(String(g.x.mesaj).split('\n')[0].slice(0,90))+'</span></span>'+
                 '<span><span class="rz '+(g.n>2?'kotu':'uyari')+'">×'+g.n+'</span></span></div>';
        }).join('')+'</div></div>' : '')+

      '<div class="kart"><div class="kart-bas"><h2>Kayıtlar</h2>'+
        '<div class="sag">'+
          '<div class="ara-kutu" style="max-width:220px">'+IK.ara+
            '<input id="ara" placeholder="sayfa/konum filtrele…" value="'+E(sayfaFiltre)+'"></div>'+
          '<button class="kucuk tehlike" onclick="temizle()">7 gün öncesini sil</button>'+
        '</div></div>'+
        '<div class="kart-govde sifir"><div class="tablo-sar"><table class="duyarli"><thead><tr>'+
        '<th>Tarih</th><th>Kullanıcı</th><th>Konum</th><th>Teknik mesaj</th><th>Sürüm</th><th>Platform</th>'+
        '</tr></thead><tbody>'+
        (kayitlar.length ? kayitlar.map(function(x){
          return '<tr><td data-bas="Tarih" class="mono">'+T(x.created_at)+'</td>'+
            '<td data-bas="Kullanıcı">'+(x.user_id ? kisiHtml(x.user_id) : '<span class="mono">oturumsuz</span>')+'</td>'+
            '<td data-bas="Konum"><b class="mono" style="color:var(--metin)">'+E(x.sayfa)+'</b></td>'+
            '<td data-bas="Mesaj" style="max-width:380px"><div class="mono" style="white-space:pre-wrap;word-break:break-word">'+
              E(x.mesaj)+'</div></td>'+
            '<td data-bas="Sürüm" class="mono">'+E(x.surum||'—')+'</td>'+
            '<td data-bas="Platform"><span class="rz notr">'+E(x.platform||'—')+'</span></td></tr>';
        }).join('') : '<tr><td colspan="6">'+bosDurum('Hata kaydı yok — tertemiz')+'</td></tr>')+
        '</tbody></table></div></div></div>';

    var zaman=null;
    document.getElementById('ara').addEventListener('input', function(){
      var v = this.value; clearTimeout(zaman);
      zaman = setTimeout(function(){ sayfaFiltre = v.trim(); yukle(); }, 300);
    });
  }

  window.temizle = async function(){
    if(!confirm('7 günden eski hata kayıtları silinsin mi?')) return;
    var sinir = new Date(Date.now()-7*24*3600*1000).toISOString();
    if(await dene(async function(){
      hataAt(await sb.from('hata_kayitlari').delete().lt('created_at', sinir));
    }, 'Eski kayıtlar silindi')) yukle();
  };

  Tazele.baslat(yukle, 30000);
})();
</script>
</body>
</html>
