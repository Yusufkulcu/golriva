<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market · GolRiva</title>
<link rel="stylesheet" href="ortak.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(typeof supabase==='undefined'){document.write('<scr'+'ipt src="https://unpkg.com/@supabase/supabase-js@2"></scr'+'ipt>')}</script>
<script src="ortak.js"></script>
</head>
<body>
<script>
(async function(){
  if(!await sayfaKur({sayfa:'market', baslik:'Market', alt:'Riva paketleri ve satın alma kayıtları'})) return;
  var G = document.getElementById('govde');

  async function yukle(){
    var urunler, satislar=[];
    try{ urunler = hataAt(await sb.from('urunler').select('*').order('sira')).data || []; }
    catch(e){ G.innerHTML = sunucuEksik('supabase/faz2_7_market.sql', e); return; }
    try{ satislar = hataAt(await sb.from('satin_almalar').select('*')
           .order('created_at',{ascending:false}).limit(100)).data || []; }catch(e){}

    await adlariYukle(satislar.map(function(s){return s.user_id;}));
    var toplamRiva = satislar.reduce(function(t,s){ return t + (s.miktar||0); }, 0);

    G.innerHTML =
      '<div class="izgara k4" style="margin-bottom:14px">'+
        '<div class="olcut"><div class="etiket">Aktif ürün</div><div class="deger">'+
          urunler.filter(function(u){return u.aktif;}).length+'</div><div class="not">toplam '+urunler.length+'</div></div>'+
        '<div class="olcut"><div class="etiket">Satış (son 100)</div><div class="deger">'+satislar.length+'</div></div>'+
        '<div class="olcut"><div class="etiket">Dağıtılan Riva</div><div class="deger">'+S(toplamRiva)+'</div></div>'+
        '<div class="olcut"><div class="etiket">Play / App Store</div><div class="deger">'+
          satislar.filter(function(s){return s.magaza==='play';}).length+' / '+
          satislar.filter(function(s){return s.magaza==='appstore';}).length+'</div></div>'+
      '</div>'+

      '<div class="kart" style="margin-bottom:14px">'+
        '<div class="kart-bas"><h2>Ürünler</h2>'+
          '<span class="ipucu">ürün kodu, mağaza konsolundaki kimlikle birebir aynı olmalı</span></div>'+
        '<div class="kart-govde sifir"><div class="tablo-sar"><table class="duyarli"><thead><tr>'+
        '<th>Kod</th><th>Ad</th><th>Riva</th><th>Görünen fiyat</th><th>Sıra</th><th>Durum</th><th></th>'+
        '</tr></thead><tbody>'+
        urunler.map(function(u){
          return '<tr>'+
            '<td data-bas="Kod" class="mono"><b>'+E(u.kod)+'</b></td>'+
            '<td data-bas="Ad"><input id="u-ad-'+E(u.kod)+'" value="'+E(u.ad)+'" style="min-width:110px"></td>'+
            '<td data-bas="Riva"><input id="u-riva-'+E(u.kod)+'" type="number" value="'+u.riva+'" style="width:90px"></td>'+
            '<td data-bas="Fiyat"><input id="u-fiyat-'+E(u.kod)+'" value="'+E(u.fiyat_metni||'')+'" placeholder="₺39,99" style="width:100px"></td>'+
            '<td data-bas="Sıra"><input id="u-sira-'+E(u.kod)+'" type="number" value="'+u.sira+'" style="width:64px"></td>'+
            '<td data-bas="Durum">'+(u.aktif?'<span class="rz iyi">satışta</span>':'<span class="rz notr">kapalı</span>')+'</td>'+
            '<td class="sag" style="white-space:nowrap">'+
              '<button class="kucuk ana" onclick="kaydet(\''+E(u.kod)+'\')">Kaydet</button> '+
              '<button class="kucuk '+(u.aktif?'tehlike':'')+'" onclick="acKapa(\''+E(u.kod)+'\','+(!u.aktif)+')">'+
                (u.aktif?'Kapat':'Aç')+'</button>'+
            '</td></tr>';
        }).join('')+
        '<tr style="background:var(--yuzey-2)">'+
          '<td data-bas="Kod"><input id="y-kod" placeholder="riva_10000" style="min-width:110px"></td>'+
          '<td data-bas="Ad"><input id="y-ad" placeholder="Efsane"></td>'+
          '<td data-bas="Riva"><input id="y-riva" type="number" placeholder="10000" style="width:90px"></td>'+
          '<td data-bas="Fiyat"><input id="y-fiyat" placeholder="₺599,99" style="width:100px"></td>'+
          '<td data-bas="Sıra"><input id="y-sira" type="number" value="9" style="width:64px"></td>'+
          '<td class="mono">yeni ürün</td>'+
          '<td class="sag"><button class="kucuk ana" onclick="ekle()">Ekle</button></td>'+
        '</tr></tbody></table></div></div></div>'+

      '<div class="kart"><div class="kart-bas"><h2>Satın almalar</h2><span class="ipucu">son 100</span></div>'+
        '<div class="kart-govde sifir"><div class="tablo-sar"><table class="duyarli"><thead><tr>'+
        '<th>Kullanıcı</th><th>Mağaza</th><th>Ürün</th><th>İşlem kimliği</th><th>Riva</th><th>Tarih</th>'+
        '</tr></thead><tbody>'+
        (satislar.length ? satislar.map(function(s){
          return '<tr><td data-bas="Kullanıcı">'+kisiHtml(s.user_id)+'</td>'+
            '<td data-bas="Mağaza"><span class="rz notr">'+E(s.magaza)+'</span></td>'+
            '<td data-bas="Ürün" class="mono">'+E(s.urun)+'</td>'+
            '<td data-bas="İşlem" class="mono">'+E(s.islem_id)+'</td>'+
            '<td data-bas="Riva" class="sayi arti">+'+S(s.miktar)+'</td>'+
            '<td data-bas="Tarih" class="mono">'+T(s.created_at)+'</td></tr>';
        }).join('') : '<tr><td colspan="6">'+bosDurum('Henüz satış yok')+'</td></tr>')+
        '</tbody></table></div></div></div>';
  }

  window.kaydet = async function(kod){
    var v = function(id){ return document.getElementById(id).value; };
    if(await dene(async function(){
      hataAt(await sb.from('urunler').update({
        ad: v('u-ad-'+kod), riva: parseInt(v('u-riva-'+kod),10),
        fiyat_metni: v('u-fiyat-'+kod) || null, sira: parseInt(v('u-sira-'+kod),10)
      }).eq('kod', kod));
    }, kod+' güncellendi')) yukle();
  };
  window.acKapa = async function(kod, aktif){
    if(await dene(async function(){ hataAt(await sb.from('urunler').update({aktif:aktif}).eq('kod',kod)); },
      kod + (aktif?' satışa açıldı':' kapatıldı'))) yukle();
  };
  window.ekle = async function(){
    var kod = document.getElementById('y-kod').value.trim();
    var ad  = document.getElementById('y-ad').value.trim();
    var riva= parseInt(document.getElementById('y-riva').value,10);
    var sira= parseInt(document.getElementById('y-sira').value,10) || 9;
    if(!/^[a-z0-9_]+$/.test(kod) || !ad || !riva || riva<=0){
      toast('Kod (küçük harf/rakam/alt çizgi), ad ve pozitif Riva gerekli', true); return; }
    if(await dene(async function(){
      hataAt(await sb.from('urunler').insert({kod:kod, ad:ad, riva:riva, sira:sira,
        fiyat_metni: document.getElementById('y-fiyat').value.trim() || null}));
    }, kod+' eklendi — mağaza konsolunda da aynı kodla ürün tanımlamayı unutma')) yukle();
  };

  yukle();
})();
</script>
</body>
</html>
