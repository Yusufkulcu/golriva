name: golriva
description: "GOLRIVA — Futbol Zekâsı Düellosu"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  supabase_flutter: ^2.8.0
  # odullu reklam (yalniz Android/iOS'ta etkin) — 9.x: guncel Gradle uyumu
  google_mobile_ads: ^9.0.0
  # sira titresimleri: HapticFeedback sistem ayarina takiliyor,
  # vibration paketi motoru dogrudan kullanir (Android/iOS/web)
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # vibration → device_info_plus zinciri: 12.4.0+ iOS'ta 'isiOSAppOnVision'
  # kullaniyor ve eski Xcode SDK'larinda derleme kiriliyor.
  # 12.3.0 bu API'siz son surum — Xcode guncellenince bu blok silinebilir.
  device_info_plus: 12.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/brand/
    - assets/icons/
