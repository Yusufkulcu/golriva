name: golriva
description: "GOLRIVA — Futbol Zekâsı Düellosu"
publish_to: "none"
version: 1.0.7+9 # +2: Play ayni versionCode'u iki kez kabul etmez

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  supabase_flutter: ^2.8.0
  # odullu reklam (yalniz Android/iOS'ta etkin) — 9.x: guncel Gradle uyumu
  google_mobile_ads: ^9.0.0
  # sira titresimleri: HapticFeedback sistem ayarina takiliyor,
  # vibration paketi motoru dogrudan kullanir (Android/iOS/web)
  vibration: ^3.1.8
  # Riva paketleri (magaza konsollarinda urunler tanimlanmali)
  in_app_purchase: ^3.2.0
  # profil fotografi secimi
  image_picker: ^1.1.2
  # PUSH BILDIRIMI (yalniz Android/iOS'ta etkin; web'de stub).
  # Firebase config dosyalari gelene kadar calisma aninda sessizce kapali kalir.
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  # onde gelen bildirimi + ozel sesi gostermek icin (Android kanallari)
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/brand/
    - assets/icons/
